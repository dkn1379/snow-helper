<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SNOW Helper — PC Review</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:#0f0f1a;color:#e2e8f0;min-height:100vh;padding:20px;}
.page{max-width:1100px;margin:0 auto;}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.title{font-family:'JetBrains Mono',monospace;font-size:1rem;font-weight:600;color:#67e8f9;letter-spacing:.05em;}
.subtitle{font-size:.75rem;color:#64748b;margin-top:4px;}
.back{font-size:.78rem;color:#a78bfa;text-decoration:none;display:flex;align-items:center;gap:4px;}
.back:hover{color:#c4b5fd;}
.stats{display:flex;gap:16px;margin-bottom:16px;}
.stat{background:#1a1a2e;border:1px solid #2a2a3e;border-radius:8px;padding:10px 16px;font-family:'JetBrains Mono',monospace;}
.stat-n{font-size:1.4rem;font-weight:600;color:#34d399;}
.stat-l{font-size:.6rem;text-transform:uppercase;letter-spacing:.1em;color:#64748b;margin-top:2px;}
.actions-bar{display:flex;gap:8px;margin-bottom:16px;align-items:center;}
.btn{padding:7px 14px;border-radius:6px;border:1px solid #2a2a3e;background:transparent;color:#e2e8f0;font-family:'Inter',sans-serif;font-size:.78rem;font-weight:500;cursor:pointer;transition:all .15s;}
.btn:hover{border-color:#a78bfa;color:#a78bfa;}
.btn-go{background:#34d399;border-color:#34d399;color:#0f0f1a;font-weight:600;}
.btn-go:hover{background:#2dd4a0;}
.btn-go:disabled{opacity:.4;cursor:default;}
.loading{text-align:center;padding:40px;color:#64748b;font-size:.85rem;}
.empty{text-align:center;padding:40px;color:#34d399;font-size:.9rem;}
.ticket-list{display:flex;flex-direction:column;gap:2px;}
.ticket{display:grid;grid-template-columns:auto 1fr auto auto auto;gap:12px;align-items:center;padding:10px 14px;background:#1a1a2e;border:1px solid #2a2a3e;border-radius:8px;transition:all .2s;}
.ticket.done{opacity:.4;background:#0f1a0f;border-color:#155724;}
.ticket.done .t-status{color:#34d399;}
.t-check{width:18px;height:18px;accent-color:#a78bfa;cursor:pointer;}
.t-info{min-width:0;}
.t-num{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:#67e8f9;}
.t-sd{font-size:.82rem;font-weight:500;color:#e2e8f0;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.t-meta{font-size:.68rem;color:#64748b;margin-top:3px;}
.t-state{font-size:.68rem;font-family:'JetBrains Mono',monospace;padding:2px 8px;border-radius:10px;background:#2a2a3e;color:#94a3b8;white-space:nowrap;}
.t-order{font-family:'JetBrains Mono',monospace;font-size:.75rem;color:#94a3b8;min-width:30px;text-align:center;}
.t-status{font-size:.72rem;color:#94a3b8;min-width:70px;text-align:center;}
.t-link{font-size:.72rem;color:#a78bfa;text-decoration:none;}
.t-link:hover{color:#c4b5fd;text-decoration:underline;}
.hdr{display:grid;grid-template-columns:auto 1fr auto auto auto;gap:12px;padding:4px 14px;font-size:.6rem;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:#475569;}
.review-type{display:flex;gap:6px;}
.review-tab{padding:5px 12px;border-radius:6px;border:1px solid #2a2a3e;background:transparent;color:#94a3b8;font-family:'Inter',sans-serif;font-size:.75rem;font-weight:500;cursor:pointer;transition:all .15s;}
.review-tab.active{background:#008970;border-color:#008970;color:#fff;}
.review-tab:hover:not(.active){border-color:#67e8f9;color:#67e8f9;}
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <div>
      <div class="title">POST-MEETING REVIEW</div>
      <div class="subtitle">Review discussed tickets and move them to Update Needed</div>
    </div>
    <a class="back" href="snow-helper.html">&larr; Back to SNOW Helper</a>
  </div>

  <div class="review-type">
    <button class="review-tab active" id="tabPC" onclick="switchTab('pc')">ASAP PC (80-89)</button>
    <button class="review-tab" id="tabDisc" onclick="switchTab('discuss')">Discuss / Office Hours (30-39)</button>
  </div>

  <div style="margin:16px 0;" id="statsBar"></div>

  <div class="actions-bar">
    <label style="font-size:.78rem;color:#94a3b8;display:flex;align-items:center;gap:6px;">
      <input type="checkbox" id="selAll" style="accent-color:#a78bfa;cursor:pointer;" onchange="toggleAll()"> Select all
    </label>
    <div style="flex:1;"></div>
    <button class="btn btn-go" id="moveBtn" onclick="moveSelected()" disabled>Move selected to Update Needed</button>
    <button class="btn" onclick="loadTickets()">Refresh</button>
  </div>

  <div class="hdr"><span></span><span>Ticket</span><span>State</span><span>Order</span><span></span></div>
  <div class="ticket-list" id="list">
    <div class="loading" id="loadMsg">Loading tickets...</div>
  </div>
</div>

<script>
(function(){
  var Q = 'b0f881a7db916e00cdb372fc0f961973';
  var BASE = 'https://umassmemorial.service-now.com';
  var tickets = [];
  var currentTab = 'pc';
  var ranges = { pc: '80@89', discuss: '30@39' };

  function getTok() {
    // Try to get token from an open SN tab via opener, otherwise prompt
    if (window.opener) {
      try { var t = window.opener.g_ck; if (t) return t; } catch(e) {}
    }
    var saved = sessionStorage.getItem('sn_token');
    if (saved) return saved;
    var t = prompt('Paste your ServiceNow g_ck token:\n\n(Open any SN page, press F12, type g_ck in console, copy the value)');
    if (t) { sessionStorage.setItem('sn_token', t); return t; }
    return '';
  }

  function api(method, path, body) {
    var tok = getTok();
    if (!tok) { alert('No token — cannot connect to ServiceNow.'); return Promise.reject('no token'); }
    return fetch(BASE + path, {
      method: method,
      headers: { 'Content-Type': 'application/json', Accept: 'application/json', 'X-UserToken': tok },
      body: body ? JSON.stringify(body) : undefined
    }).then(function(r) { return r.json(); });
  }

  window.switchTab = function(tab) {
    currentTab = tab;
    document.getElementById('tabPC').className = 'review-tab' + (tab === 'pc' ? ' active' : '');
    document.getElementById('tabDisc').className = 'review-tab' + (tab === 'discuss' ? ' active' : '');
    loadTickets();
  };

  window.loadTickets = function() {
    var list = document.getElementById('list');
    list.innerHTML = '<div class="loading">Loading tickets...</div>';
    document.getElementById('moveBtn').disabled = true;
    document.getElementById('selAll').checked = false;

    var range = ranges[currentTab];
    var q = 'active=true^assignment_group=' + Q + '^orderBETWEEN' + range;
    var fields = 'sys_id,number,short_description,state,order,assigned_to,sys_updated_on';

    Promise.all([
      api('GET', '/api/now/table/sc_task?sysparm_query=' + encodeURIComponent(q) + '&sysparm_fields=' + fields + '&sysparm_display_value=true&sysparm_limit=100'),
      api('GET', '/api/now/table/incident?sysparm_query=' + encodeURIComponent(q) + '&sysparm_fields=' + fields + '&sysparm_display_value=true&sysparm_limit=100')
    ]).then(function(results) {
      tickets = [];
      results.forEach(function(r) { (r.result || []).forEach(function(t) { tickets.push(t); }); });

      var statsBar = document.getElementById('statsBar');
      statsBar.innerHTML = '<div class="stats"><div class="stat"><div class="stat-n">' + tickets.length + '</div><div class="stat-l">Tickets to review</div></div></div>';

      if (!tickets.length) {
        list.innerHTML = '<div class="empty">No ' + (currentTab === 'pc' ? 'ASAP PC' : 'Discuss') + ' tickets found. All clear!</div>';
        return;
      }

      list.innerHTML = tickets.map(function(t, i) {
        var num = t.number || '';
        var tbl = /^INC/.test(num) ? 'incident' : (/^CHG/.test(num) ? 'change_request' : 'sc_task');
        var link = BASE + '/nav_to.do?uri=' + tbl + '.do?sys_id=' + t.sys_id;
        var updated = (t.sys_updated_on || '').substring(0, 10);
        var assignee = t.assigned_to && t.assigned_to.display_value ? t.assigned_to.display_value : '';
        return '<div class="ticket" id="row-' + i + '">' +
          '<input type="checkbox" class="t-check" data-idx="' + i + '" onchange="updateBtn()">' +
          '<div class="t-info">' +
            '<div class="t-num">' + num + (assignee ? ' &middot; ' + assignee : '') + '</div>' +
            '<div class="t-sd">' + (t.short_description || '') + '</div>' +
            '<div class="t-meta">Updated: ' + updated + '</div>' +
          '</div>' +
          '<span class="t-state">' + (t.state || '') + '</span>' +
          '<span class="t-order">' + (t.order || '') + '</span>' +
          '<span class="t-status"><a class="t-link" href="' + link + '" target="_blank">Open &rarr;</a></span>' +
        '</div>';
      }).join('');
    }).catch(function(e) {
      list.innerHTML = '<div class="loading" style="color:#f87171;">Error loading tickets. Check your token.</div>';
    });
  };

  window.toggleAll = function() {
    var on = document.getElementById('selAll').checked;
    document.querySelectorAll('.t-check').forEach(function(cb) {
      if (!cb.closest('.done')) cb.checked = on;
    });
    updateBtn();
  };

  window.updateBtn = function() {
    var n = document.querySelectorAll('.t-check:checked').length;
    var btn = document.getElementById('moveBtn');
    btn.disabled = n === 0;
    btn.textContent = n ? 'Move ' + n + ' ticket' + (n > 1 ? 's' : '') + ' to Update Needed' : 'Move selected to Update Needed';
  };

  window.moveSelected = function() {
    var checks = document.querySelectorAll('.t-check:checked');
    if (!checks.length) return;
    var idxs = [];
    checks.forEach(function(cb) { idxs.push(parseInt(cb.getAttribute('data-idx'))); });

    if (!confirm('Move ' + idxs.length + ' ticket(s) to Update Needed?\n\nThis changes the Order tens digit from ' + (currentTab === 'pc' ? '8' : '3') + ' to 1.')) return;

    var btn = document.getElementById('moveBtn');
    btn.disabled = true;
    btn.textContent = 'Updating...';

    Promise.all(idxs.map(function(i) {
      var t = tickets[i];
      var digits = (t.order || '80').toString().replace(/\D/g, '') || '80';
      var newOrd = '1' + digits.slice(-1);
      var tbl = /^INC/.test(t.number) ? 'incident' : (/^CHG/.test(t.number) ? 'change_request' : 'sc_task');
      return api('PATCH', '/api/now/table/' + tbl + '/' + t.sys_id, { order: newOrd }).then(function() {
        var row = document.getElementById('row-' + i);
        if (row) {
          row.classList.add('done');
          row.querySelector('.t-order').textContent = newOrd;
          row.querySelector('.t-status').textContent = 'Moved';
          row.querySelector('.t-check').checked = false;
          row.querySelector('.t-check').disabled = true;
        }
        return t.number + ': ' + t.order + ' → ' + newOrd;
      }).catch(function() { return t.number + ': FAILED'; });
    })).then(function(res) {
      btn.textContent = 'Done!';
      setTimeout(function() { updateBtn(); }, 1500);
    });
  };

  // Auto-load on page open
  loadTickets();
})();
</script>
</body>
</html>
